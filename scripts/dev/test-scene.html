<!doctype html>
<!--
  Saver test scene (scripts/dev/make-test-playlist.sh copies it into the test playlist).
  A stand-in for a compiled LivePaper scene: it implements only the host bridge the saver drives
  (window.LIVEPAPER_CONFIG in, LivePaper.host.{pause,resume,lockUI,config,power} and
  webkit.messageHandlers.livepaper out) plus a runtime-style clock, and exposes its state as
  window.__lpTest so scripts/dev/saverhost-lp.swift can assert on it.
-->
<html>
<head>
<meta charset="utf-8">
<title>LivePaper saver test scene</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; cursor: none; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #clock { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none;
           color: rgba(255, 255, 255, 0.9); text-shadow: 0 0 6px rgba(0, 0, 0, 0.28);
           font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; transition: opacity 300ms ease; }
  #date { font-weight: 600; }
  #time { font-weight: 700; line-height: 1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="clock"><div id="date"></div><div id="time"></div></div>
<script>
(function () {
  'use strict';
  var cfg = window.LIVEPAPER_CONFIG || {};
  var state = { config: cfg, paused: false, lockUI: false, frames: 0, calls: [], clockOpacity: 1 };
  window.__lpTest = state;

  var stage = document.getElementById('stage'), ctx = stage.getContext('2d');
  var clock = document.getElementById('clock'), dateEl = document.getElementById('date'), timeEl = document.getElementById('time');
  var raf = 0, last = 0, t = 0, fps = cfg.fps || 60;

  function post(msg) {
    var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.livepaper;
    if (h) h.postMessage(msg);
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function layout() {
    var w = window.innerWidth, h = window.innerHeight, dpr = (window.devicePixelRatio || 1) * (cfg.scale || 1);
    stage.width = Math.round(w * dpr); stage.height = Math.round(h * dpr);
    // Same geometry as the runtime clock: time = clamp(min(w*.11, h*.15), 40, 210), date = max(13, time*.2).
    var time = clamp(Math.min(w * 0.11, h * 0.15), 40, 210), date = Math.max(13, time * 0.2);
    clock.style.top = (h * 0.07) + 'px';
    dateEl.style.fontSize = date + 'px';
    timeEl.style.fontSize = time + 'px';
  }
  function tick() {
    var d = new Date();
    dateEl.textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    timeEl.textContent = d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M$/i, '');
  }
  function applyClock() {
    var visible = cfg.clock !== false && cfg.clockPosition !== 'none' && !state.lockUI;
    state.clockOpacity = visible ? 1 : 0;
    clock.style.opacity = String(state.clockOpacity);
  }
  function draw() {
    var w = stage.width, h = stage.height;
    var g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#16204a'); g.addColorStop(1, '#030409');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    // A seeded hue so displays sharing a session seed look identical.
    var hue = ((cfg.seed || 1) * 47) % 360;
    var x = w * (0.5 + 0.35 * Math.cos(t * 0.6)), y = h * (0.62 + 0.12 * Math.sin(t * 1.1)), r = Math.min(w, h) * 0.22;
    var glow = ctx.createRadialGradient(x, y, 0, x, y, r);
    glow.addColorStop(0, 'hsla(' + hue + ',80%,65%,0.9)'); glow.addColorStop(1, 'hsla(' + hue + ',80%,65%,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
  }
  function frame(now) {
    raf = 0;
    if (state.paused) return;
    if (!last || now - last >= 1000 / fps - 1) {
      t += last ? Math.min(0.1, (now - last) / 1000) : 0;
      last = now;
      draw();
      state.frames++;
      if (state.frames === 2) post({ type: 'ready', scene: 'test-web' });
    }
    raf = requestAnimationFrame(frame);
  }
  function start() { if (!raf && !state.paused) { last = 0; raf = requestAnimationFrame(frame); } }

  window.LivePaper = {
    host: {
      pause: function () { state.calls.push('pause'); state.paused = true; if (raf) { cancelAnimationFrame(raf); raf = 0; } },
      resume: function () { state.calls.push('resume'); state.paused = false; start(); },
      lockUI: function (showing) { state.calls.push('lockUI(' + !!showing + ')'); state.lockUI = !!showing; applyClock(); },
      config: function (o) { state.calls.push('config'); for (var k in o) cfg[k] = o[k]; fps = cfg.fps || fps; applyClock(); },
      power: function (o) { state.calls.push('power'); for (var k in o) cfg[k] = o[k]; fps = cfg.fps || fps; }
    }
  };

  window.addEventListener('resize', function () { layout(); draw(); });
  layout(); tick(); applyClock(); start();
  setInterval(tick, 1000);
  // Exercises the saver's scene-error logging (os_log, category "scene").
  post({ type: 'error', message: 'test scene: deliberate error report (expected)' });
})();
</script>
</body>
</html>
